.ans{direction:ltr;text-align:left;min-height:52px;font:600 24px/1.6 Georgia,serif;border:2px dashed #2a3a63;border-radius:10px;padding:6px 12px;margin:10px 0;color:#23C4F8;cursor:text}
#kb{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#0b1428;border-top:1px solid #1e2a4a;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .4s cubic-bezier(.23,1,.32,1)}
#kb.show{transform:none}
.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:420px;margin:0 auto;direction:ltr}
.k{padding:12px 0;border:0;border-radius:10px;background:#16213f;font-size:19px;transition:background .15s,transform .1s}.k:active{background:#275EFE;transform:scale(.94)}
.k.w{grid-column:span 5;background:linear-gradient(135deg,#23C4F8,#275EFE);font-weight:600}
.ab{position:relative;display:flex;align-items:center;gap:4px;padding:14px 34px;border:4px solid transparent;font-size:16px;background-color:transparent;border-radius:100px;font-weight:600;color:greenyellow;box-shadow:0 0 0 2px greenyellow;cursor:pointer;overflow:hidden;transition:all .6s cubic-bezier(.23,1,.32,1)}
.ab svg{position:absolute;width:24px;fill:greenyellow;z-index:9;transition:all .8s cubic-bezier(.23,1,.32,1)}
.ab .arr-1{right:16px}.ab .arr-2{left:-25%}
.ab .circle{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:20px;height:20px;background-color:greenyellow;border-radius:50%;opacity:0;transition:all .8s cubic-bezier(.23,1,.32,1)}
.ab .text{position:relative;z-index:1;transform:translateX(-12px);transition:all .8s cubic-bezier(.23,1,.32,1)}
.ab:hover{box-shadow:0 0 0 12px transparent;color:#212121;border-radius:12px}
.ab:hover .arr-1{right:-25%}.ab:hover .arr-2{left:16px}.ab:hover .text{transform:translateX(12px)}
.ab:hover svg{fill:#212121}.ab:active{scale:.95;box-shadow:0 0 0 4px greenyellow}
.ab:hover .circle{width:220px;height:220px;opacity:1}
#ld{position:fixed;inset:0;z-index:99;background:#070c18;display:flex;align-items:center;justify-content:center;transition:opacity .6s}#ld.hide{opacity:0;pointer-events:none}
.loader{--background:linear-gradient(135deg,#23C4F8,#275EFE);--shadow:rgba(39,94,254,.28);--text:#9aa7c2;--page:rgba(255,255,255,.36);--page-fold:rgba(255,255,255,.52);--duration:3s;width:200px;height:140px;position:relative;direction:ltr}
.loader:before,.loader:after{--r:-6deg;content:"";position:absolute;bottom:8px;width:120px;top:80%;box-shadow:0 16px 12px var(--shadow);transform:rotate(var(--r))}
.loader:before{left:4px}.loader:after{--r:6deg;right:4px}
.loader div{width:100%;height:100%;border-radius:13px;position:relative;z-index:1;perspective:600px;box-shadow:0 4px 6px var(--shadow);background-image:var(--background)}
.loader div ul{margin:0;padding:0;list-style:none;position:relative}
.loader div ul li{--r:180deg;--o:0;--c:var(--page);position:absolute;top:10px;left:10px;transform-origin:100% 50%;color:var(--c);opacity:var(--o);transform:rotateY(var(--r));animation:var(--duration) ease infinite}
.loader div ul li:nth-child(2){--c:var(--page-fold);animation-name:page-2}.loader div ul li:nth-child(3){--c:var(--page-fold);animation-name:page-3}
.loader div ul li:nth-child(4){--c:var(--page-fold);animation-name:page-4}.loader div ul li:nth-child(5){--c:var(--page-fold);animation-name:page-5}
.loader div ul li svg{width:90px;height:120px;display:block}
.loader div ul li:first-child{--r:0deg;--o:1}.loader div ul li:last-child{--o:1}
.loader span{display:block;left:0;right:0;top:100%;margin-top:20px;text-align:center;color:var(--text)}
@keyframes page-2{0%{transform:rotateY(180deg);opacity:0}20%{opacity:1}35%,100%{opacity:0}50%,100%{transform:rotateY(0deg)}}
@keyframes page-3{15%{transform:rotateY(180deg);opacity:0}35%{opacity:1}50%,100%{opacity:0}65%,100%{transform:rotateY(0deg)}}
@keyframes page-4{30%{transform:rotateY(180deg);opacity:0}50%{opacity:1}65%,100%{opacity:0}80%,100%{transform:rotateY(0deg)}}
@keyframes page-5{45%{transform:rotateY(180deg);opacity:0}65%{opacity:1}80%,100%{opacity:0}95%,100%{transform:rotateY(0deg)}}
@media(prefers-reduced-motion:reduce){.page,.step,.hint{animation:none}}

<script>
const U=[["1.1","Real Numbers","الأعداد الحقيقية"],["1.2","Exponents","الأسس"],["1.3","Algebraic Expressions","التعبيرات الجبرية"],["1.4","Rational Expressions","الصيغ الجبرية النسبية"],["1.5","Equations","المعادلات"],["1.6","Modeling with Equations","التطبيقات على المعادلات"],["1.7","Inequalities","المتباينات"],["1.8","Coordinate Geometry","الهندسة الإحداثية"],["1.9","Page missing","بانتظار الصفحة"],["1.10","Lines","المستقيمات"],["R","Mixed Review","مراجعة عامة"]];
// part = [type, title, content]. i idea, t terms, h tips, w watch out, x worked example, c check yourself
const GD={
"1.1":[
["i","The big idea","Number sets sit inside each other, like boxes. Natural numbers are inside whole numbers, whole numbers are inside integers, and integers are inside rational numbers. Rational and irrational numbers together make up the real numbers."],
["t","Number sets",["Natural numbers^الأعداد الطبيعية^The counting numbers. They start at 1.^1, 2, 3","Odd natural numbers^الأعداد الفردية^Natural numbers that cannot be split into two equal groups.^1, 3, 5, 7","Even natural numbers^الأعداد الزوجية^Natural numbers that can be divided by 2 with nothing left over.^2, 4, 6, 8","Whole numbers^الأعداد الكلية^The natural numbers plus 0.^0, 1, 2, 3","Integers^الأعداد الصحيحة^Whole numbers and their negatives.^−2, −1, 0, 1, 2","Rational numbers^الأعداد النسبية^Any number that can be written as P/Q, where P and Q are integers and Q is not 0.^2/3, 1/5, 7/8","Irrational numbers^الأعداد غير النسبية^Numbers that cannot be written as P/Q. Their decimals never end and never repeat.^√2, π, e","Real numbers^الأعداد الحقيقية^All the rational and irrational numbers together.^every number above"]],
["w","Watch out",["On your sheet, natural numbers start at 1 and whole numbers start at 0. So 0 is whole, but not natural.","−3 is an integer, but it is not a whole number.","Not every root is irrational. √2 is irrational, but √4 = 2 is rational."]],
["c","Check yourself",["Is −3 a whole number?^No. It is an integer.","Is 0.5 rational?^Yes. It equals 1/2.","Which one is irrational: 3/4, π or 0?^π."]],
["t","Operations and fractions",["Addition^الجمع^Finding the total of two or more numbers.^2 + 3 = 5","Subtraction^الطرح^Taking one amount away from another.^6 − 2 = 4","Multiplication^الضرب^Shows how many times a number is added to itself.^3 × 4 = 12","Division^القسمة^Shows how many times one number fits inside another.^16 ÷ 2 = 8","Denominator^المقام^The bottom number of a fraction. It can never be 0.^in 1/3 the denominator is 3","Reciprocal^قلب الكسر (مقلوب)^The number you multiply by to get 1. Just flip the fraction.^the reciprocal of 4/5 is 5/4","Simplify^التبسيط^Rewrite something in its simplest form without changing its value.^3/12 ⇒ 1/4"]],
["h","Think like this",["A denominator can never be 0, because you cannot share something into 0 groups.","Zero has no reciprocal, because nothing times 0 gives 1.","To find the reciprocal of a whole number, write it as a fraction first: 7 = 7/1, so its reciprocal is 1/7."]],
["c","Check yourself",["What is the reciprocal of 7?^1/7.","Simplify 6/18.^1/3."]],
["t","Sets, intervals and absolute value",["Sets^المجموعات^A well-defined collection of objects or numbers.^S = {1, 2, 3, 6}","Empty set^المجموعة الخالية^A set with no elements. Written { } or φ.^φ","Union of sets (∪)^اتحاد المجموعات^Everything that is in either set. A shared element is written once.^S ∪ B = {1, 2, 3, 4, 5, 6}","Intersection of sets (∩)^تقاطع المجموعات^Only the elements that both sets share.^S ∩ B = {6}","Intervals^الفترات^A connected piece of the number line. A square bracket [ ] includes the end, a round bracket ( ) leaves it out.^[2, 3]","Absolute value^القيمة المطلقة^The distance of a number from zero. It is never negative.^|−2| = 2"]],
["x","Worked example: sets","Let S = {1, 2, 3, 6} and B = {4, 5, 6}. → Union: list everything from both sets, and write 6 only once. → S ∪ B = {1, 2, 3, 4, 5, 6} → Intersection: keep only what is in both sets. → S ∩ B = {6}"],
["c","Check yourself",["Find {1, 2} ∪ {2, 3}.^{1, 2, 3}.","Find {1, 2} ∩ {3, 4}.^φ, the empty set. They share nothing.","Evaluate |−7| and |7|.^Both are 7."]]],
"1.2":[
["i","The big idea","An exponent is a short way to write repeated multiplication. The big number is the base. The small raised number is the exponent, and it tells you how many times to multiply the base by itself."],
["t","Key words",["Exponents / power^الأس^How many times the base multiplies itself.^2³ = 8","Exponential form^الصيغة الأسية^An expression written as aⁿ, where a is the base and n is the exponent.^5³ = 5 × 5 × 5","Evaluate^أوجد الناتج^Find the value.^1 + 6 = 7","Eliminate^الشطب أو حذف المتشابه^Remove a common factor from the top and the bottom.^ab/ac = b/c","Eliminate negative power^حذف الأس السالب^Take the reciprocal so that the exponent becomes positive.^a⁻² ⇒ 1/a²  and  1/a⁻² ⇒ a²"]],
["x","Worked example: evaluate","Evaluate 2³. → The base is 2 and the exponent is 3. → Multiply 2 three times: 2 × 2 × 2. → 2³ = 8"],
["x","Worked example: negative power","Write 2⁻³ with a positive exponent. → A negative exponent means take the reciprocal. → 2⁻³ = 1/2³ → 1/2³ = 1/8"],
["w","Watch out",["2³ is not 2 × 3. It is 2 × 2 × 2 = 8.","A negative exponent does not make the answer negative. 2⁻¹ = 1/2.","Eliminate only works on factors that are multiplied, not on terms that are added. In (a + b)/a you cannot cancel the a’s."]],
["c","Check yourself",["Evaluate 3⁴.^81.","Write 2⁻³ with a positive exponent.^1/2³ = 1/8.","Simplify 1/x⁻⁵.^x⁵."]]],
"1.3":[
["i","The big idea","An algebraic expression is built from numbers and letters joined by + − × ÷. We will use 3x² − 5 as our running example and name every piece of it."],
["t","Building blocks",["Variables^المتغيرات^A symbol that can take different numerical values.^x, y, z","Constant^الثوابت^A symbol or number with a fixed value.^−5, 6, 0","Algebraic expression^التعبير الجبري^Constants and variables joined by some of + − × ÷.^3x² − 5","Terms^الحدود الجبرية^The parts of an expression separated by + or −.^3x²  and  −5","Coefficient^المعامل^The number that multiplies the variable.^in 4x the coefficient is 4","Constant term^الحد الثابت^The term that has no variable.^in 3x² − 5 it is −5"]],
["h","Think like this",["The sign belongs to the term. In 3x² − 5 the second term is −5, not 5.","In 5x the coefficient is 5. In x alone the coefficient is 1.","Variables are the changing part. Constants never change."]],
["t","Types of expressions",["Like terms^الحدود المتشابهة^Terms with the same variable and the same power.^3x², 5x², x²","Unlike terms^الحدود غير المتشابهة^Terms where the variable or the power is different.^3xy, 3x, y, x³","Monomial^أحادي الحد^An expression with one term.^5x","Binomial^ثنائي الحدود^An expression with two terms.^3x + 2","Trinomial^ثلاثي الحدود^An expression with three terms.^x² + 4x + 1","Polynomial^متعدد الحدود^A sum of monomials. It can have many terms.^aₙxⁿ + … + a₁x + a₀","Degree of a polynomial^درجة الحد^The highest power of the variable.^5x³ − 2x + 4 has degree 3"]],
["w","Watch out",["A polynomial can have any number of terms. Monomials and binomials are polynomials too.","Terms are like only if both the variable and the power match. 4x² and 4x³ are not like.","When you add like terms, add the coefficients and keep the power: 3x² + 5x² = 8x², not 8x⁴."]],
["c","Check yourself",["Are 4x² and 7x² like terms? Are 4x² and 4x³?^Yes. No, the powers are different.","What is the degree of 2x⁴ − x + 9?^4.","Name x² + 4x + 1 by its number of terms.^Trinomial."]]],
"1.4":[
["i","The big idea","Identities and factoring let you rewrite an expression in a different shape without changing its value. A rational expression is a fraction made from polynomials, and you can often make it simpler."],
["t","Identities and factoring",["Algebraic identities^المتطابقات الجبرية^An equation that is true for every possible value of its variables.^(a + b)(a − b) = a² − b²","Factorization^التحليل (إيجاد الأقواس)^Write an expression as a product of simpler expressions.^x² + x − 6 = (x − 2)(x + 3)","Sum^الجمع^The result of adding.^3 + 2","Product^حاصل الضرب^The result of multiplying.^3 × 2"]],
["h","Identities to know",["(a + b)² = a² + 2ab + b²","(a − b)² = a² − 2ab + b²","(a + b)(a − b) = a² − b²"]],
["x","Worked example: factoring","Factor x² + x − 6. → Find two numbers that multiply to −6 and add to 1. → They are 3 and −2. → x² + x − 6 = (x − 2)(x + 3)"],
["t","Rational expressions",["Rational expressions^الصيغة الجبرية النسبية^An expression written as P/Q, where P and Q are polynomials and Q is not 0.^(3 + x)/(2x − 4)","Lowest form^الصيغة المبسطة (التبسيط)^A fraction whose top and bottom share no common factor except 1.^(x² − 4)/(x + 2) ⇒ x − 2"]],
["x","Worked example: lowest form","Simplify (x² − 4)/(x + 2). → Factor the top: x² − 4 = (x − 2)(x + 2). → Cancel the common factor (x + 2). → The answer is x − 2, as long as x is not −2."],
["w","Watch out",["Sum and product are answers, not instructions. “The product of 3 and 2” means 3 × 2 = 6.","Cancel factors, never terms. You can cancel (x + 2) from top and bottom, but not the x in x + 2.","Remember the restriction: the denominator can never be 0."]],
["c","Check yourself",["Expand (x + 3)².^x² + 6x + 9.","Factor x² − 9.^(x − 3)(x + 3).","Put (x² − 1)/(x − 1) in lowest form.^x + 1."]]],
"1.5":[
["i","The big idea","An equation says that two expressions have the same value. To solve it, you find the value of the variable that makes it true. The golden rule: whatever you do to one side, do to the other."],
["t","Types of equations",["Equation^المعادلات^A statement that two mathematical expressions have the same value.^2x² − 1 = 7","Linear equation^المعادلة الخطية^An equation of degree 1.^4x − 1 = 3","Solution / root^الحل^The value of the variable that makes the equation true.^3x + 1 = 7 ⇒ x = 2","Solve^أوجد الحل / أوجد قيمة المتغير^Find the value of the variable.^x = ?","Non-linear equation^معادلة غير خطية^An equation whose degree is not 1.^x² + 2x − 1 = 2"]],
["x","Worked example: linear","Solve 3x + 1 = 7. → Subtract 1 from both sides: 3x = 6. → Divide both sides by 3: x = 2. → Check: 3(2) + 1 = 7 ✓"],
["t","Tools for solving",["Cross multiplication^الضرب التبادلي^For a/b = c/d, write ad = bc.^2x/3 = 1/5 ⇒ 10x = 3","Quadratic equation^معادلة تربيعية^An equation of degree 2.^x² + 5x = 6","Standard form^الصيغة العامة للمعادلة التربيعية^The quadratic written with everything on one side and 0 on the other.^ax² + bx + c = 0","Formula^قانون^A general rule that uses symbols to relate quantities.^y = mx + b","Discriminant^المميز^The number D = b² − 4ac. It tells you how many real solutions a quadratic has.^D = b² − 4ac"]],
["x","Worked example: cross multiplication","Solve 2x/3 = 1/5. → Cross multiply: 2x × 5 = 3 × 1. → 10x = 3 → x = 3/10"],
["h","Think like this",["“Solve” always means find the variable. “Solution” and “root” mean the answer.","Move everything to one side first. x² + 5x = 6 becomes x² + 5x − 6 = 0, so a = 1, b = 5, c = −6.","If D > 0 there are two different real solutions. If D = 0 there is one repeated solution. If D < 0 there are no real solutions."]],
["c","Check yourself",["Solve 3x + 2 = 11.^x = 3.","Cross multiply x/4 = 3/2.^2x = 12, so x = 6.","Find D for x² + 5x − 6 = 0.^25 + 24 = 49."]]],
"1.6":[
["i","The big idea","The skill here is turning English into algebra. Read the sentence slowly, name the unknown number x, then write each phrase as maths."],
["t","Translation words",["Modeling with equations^التطبيقات العملية على المعادلات^Translate a word problem into algebraic symbols.^","Construct the equation^تكوين معادلة^Build the equation from the words.^","Consecutive numbers^أعداد متتالية^Integers that follow each other with none skipped.^n, n + 1, n + 2","Twice^ضعف العدد^Two times the number.^twice 3 = 6, so 2n","Thrice^ثلاثة أضعاف العدد^Three times the number.^thrice 4 = 12, so 3n","Times^ضرب العدد^Multiply by.^","Half^نصف العدد^The number divided by 2.^half of 8 = 4, so n/2","More than^أكبر من^Greater than.^7 > 3","Less than^أصغر من^Smaller than.^1 < 5","Difference^الفرق^The result of subtracting two quantities.^difference of 5 and 3 = 5 − 3 = 2"]],
["w","Watch out: order of words",["“7 more than x” is x + 7.","“7 less than x” is x − 7, not 7 − x.","“The difference between 5 and 3” is 5 − 3 = 2: bigger minus smaller.","“More than” can compare (x is more than 3) or add (3 more than x). Read the sentence both ways."]],
["t","Rectangle words",["Rectangle^مستطيل^A four-sided shape with four right angles. Opposite sides are equal and parallel.^","Length^الطول^The measurement of the longer side.^","Width^العرض^The measurement of the shorter side.^","Area^المساحة^The space a shape covers. For a rectangle: length × width.^length × width"]],
["x","Worked example: rectangle","The length of a rectangle is 3 more than its width. The area is 40. → Let the width be w. Then the length is w + 3. → Construct the equation: w(w + 3) = 40. → Standard form: w² + 3w − 40 = 0. → Factor: (w + 8)(w − 5) = 0, so w = 5. A width cannot be negative. → The length is 8. Check: 5 × 8 = 40 ✓"],
["c","Check yourself",["Write “twice a number plus 3 equals 11” and solve it.^2n + 3 = 11, so n = 4.","Three consecutive numbers add to 24. Find them.^n + (n + 1) + (n + 2) = 24, so 7, 8, 9."]]],
"1.7":[
["i","The big idea","An inequality compares two values that are not equal. You solve it almost exactly like an equation, with one extra rule about negative numbers."],
["t","Types of inequalities",["Inequalities^المتباينة^A statement comparing two values using <, >, ≤ or ≥.^x ≤ 3","Linear inequality^المتباينة الخطية^An inequality of degree 1.^3x − 1 ≤ 5","Compound inequality^المتباينة المركبة^Two inequalities combined in one statement.^2 ≤ x ≤ 5","Quadratic inequality^المتباينة التربيعية^An inequality of degree 2.^x² + 2x ≤ 4"]],
["h","Think like this",["Solve like an equation. The extra rule: when you multiply or divide by a negative number, flip the sign.","≤ and ≥ include the end value. < and > do not. This links to the brackets in intervals.","Read 2 ≤ x ≤ 5 as “x is between 2 and 5, including both”."]],
["x","Worked example: flipping the sign","Solve −2x < 6. → Divide both sides by −2. → Dividing by a negative flips the sign. → x > −3"],
["c","Check yourself",["Solve 3x − 1 ≤ 5.^x ≤ 2.","Solve −x > 4.^x < −4.","Is 5 a solution of 2 ≤ x ≤ 5?^Yes, because 5 is included."]]],
"1.8":[
["i","The big idea","The coordinate plane is a map made from two number lines that cross. Every point on it has an address (x, y): go along first, then up or down."],
["t","The plane",["Coordinate plane^المستوى الاحداثي (الرسم البياني)^A plane with a vertical line and a horizontal line that cross at 0.^","Vertical number line / y-axis^خط الأعداد العمودي (الاحداثي الصادي)^The up-and-down line, with numbers at equal steps.^","Horizontal number line / x-axis^خط الأعداد الأفقي (الاحداثي السيني)^The left-to-right line, with numbers at equal steps.^","Origin^نقطة الأصل^The point where the two axes meet.^(0, 0)","Coordinates of a point^احداثي النقطة^The pair P(x, y) that gives the point’s position.^(2, 3)","To plot points^رسم النقاط^Mark the position of the points on the plane.^","Quadrants^الأرباع في المستوى الاحداثي^The four regions the axes make.^first, second, third, fourth"]],
["h","Think like this",["Quadrant I is (+, +). Quadrant II is (−, +). Quadrant III is (−, −). Quadrant IV is (+, −).","Always write coordinates as (x, y): the x value comes first.","The origin is (0, 0), where x and y are both 0."]],
["t","Measuring on the plane",["Distance formula^قانون المسافة^The formula used to find the distance between two points.^","Closer^اقرب الى^Nearer. Compare two distances and pick the smaller.^","Midpoint formula^قانون نقطة المنتصف^The formula used to find the middle point of two points.^","Line segment^القطعة المستقيمة^A part of a line with two fixed endpoints.^","End points of a line^نقاط البداية والنهاية^The two extreme points of a segment.^"]],
["h","Formulas",["Distance: d = √[(x₂ − x₁)² + (y₂ − y₁)²]","Midpoint: ((x₁ + x₂)/2 , (y₁ + y₂)/2)"]],
["x","Worked example: midpoint","Find the midpoint of (2, 4) and (6, 8). → Average the x values: (2 + 6)/2 = 4. → Average the y values: (4 + 8)/2 = 6. → The midpoint is (4, 6)."],
["x","Worked example: distance","Find the distance from (0, 0) to (3, 4). → Differences: 3 − 0 = 3 and 4 − 0 = 4. → d = √(3² + 4²) = √(9 + 16). → d = √25 = 5"],
["w","Watch out",["Distance is a length, so it is never negative.","A midpoint is a point, so it has two coordinates, not one number.","Do not swap x and y when you plot."]],
["c","Check yourself",["In which quadrant is (−3, 4)?^Quadrant II.","Midpoint of (2, 4) and (6, 8)?^(4, 6).","Distance from (0, 0) to (3, 4)?^5."]]],
"1.10":[
["i","The big idea","A straight line is the graph of a linear equation y = mx + b. The number m is the slope, which tells you how steep the line is. The number b is the y-intercept, where the line crosses the y-axis."],
["t","Key words",["Line^الخط^The graph of a linear equation y = mx + b.^y = 2x + 3","Slope of a line^ميل الخط^Measures how steep the line is: m = (y₂ − y₁)/(x₂ − x₁).^m = 2","Steepness^شدة الانحدار^How sharply the line rises or falls as you move left to right. A bigger |m| means steeper.^","Undefined^الميل غير معرف^An expression with no meaningful or valid result.^vertical line"]],
["h","Think like this",["In y = 2x + 3 the slope is 2 (up 2 for every 1 across) and the y-intercept is 3 (the line crosses at (0, 3)).","A positive slope rises. A negative slope falls. A horizontal line has slope 0.","A vertical line has an undefined slope, because the denominator x₂ − x₁ would be 0."]],
["x","Worked example: slope","Find the slope through (1, 2) and (3, 8). → m = (y₂ − y₁)/(x₂ − x₁) → m = (8 − 2)/(3 − 1) = 6/2 → m = 3"],
